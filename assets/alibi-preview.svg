<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Схема первого экрана лендинга барбершопа «Алиби»">
  <!-- Схематичное превью. [ЗАПОЛНИТЬ] заменить на реальный скриншот сайта 1600×1000 -->
  <rect width="1600" height="1000" fill="#16130f"/>
  <!-- Навигация -->
  <rect x="0" y="0" width="1600" height="96" fill="#1d1914"/>
  <text x="96" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#e8d3a6" letter-spacing="6">АЛИБИ</text>
  <g fill="#8a8072">
    <rect x="760" y="42" width="96" height="12" rx="6"/>
    <rect x="890" y="42" width="110" height="12" rx="6"/>
    <rect x="1034" y="42" width="84" height="12" rx="6"/>
  </g>
  <rect x="1300" y="26" width="204" height="44" rx="22" fill="none" stroke="#c9a96a" stroke-width="2"/>
  <rect x="1340" y="43" width="124" height="10" rx="5" fill="#c9a96a"/>

  <!-- Первый экран -->
  <text x="96" y="250" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#c9a96a" letter-spacing="5">БАРБЕРШОП</text>
  <text x="96" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#f3ead8">Мужские</text>
  <text x="96" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#f3ead8">стрижки</text>
  <g fill="#6f675b">
    <rect x="96" y="530" width="560" height="16" rx="8"/>
    <rect x="96" y="566" width="430" height="16" rx="8"/>
  </g>
  <rect x="96" y="640" width="260" height="72" rx="36" fill="#c9a96a"/>
  <text x="226" y="685" text-anchor="middle" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#16130f">Записаться</text>
  <rect x="380" y="640" width="220" height="72" rx="36" fill="none" stroke="#4a4237" stroke-width="2"/>
  <rect x="430" y="670" width="120" height="12" rx="6" fill="#8a8072"/>

  <!-- Визуал справа -->
  <path d="M960 900V330a250 250 0 0 1 500 0v570z" fill="#231e18"/>
  <path d="M1010 900V340a200 200 0 0 1 400 0v560z" fill="#2c261e"/>
  <g transform="translate(1210 290)">
    <rect x="-34" y="0" width="68" height="440" rx="34" fill="#efe7d6"/>
    <clipPath id="pole"><rect x="-34" y="0" width="68" height="440" rx="34"/></clipPath>
    <g clip-path="url(#pole)" fill="#a33b2c">
      <path d="M-60 40 60 -20v40L-60 80z"/>
      <path d="M-60 140 60 80v40L-60 180z"/>
      <path d="M-60 240 60 180v40L-60 280z"/>
      <path d="M-60 340 60 280v40L-60 380z"/>
      <path d="M-60 440 60 380v40L-60 480z"/>
    </g>
    <rect x="-46" y="-28" width="92" height="36" rx="12" fill="#c9a96a"/>
    <rect x="-46" y="432" width="92" height="36" rx="12" fill="#c9a96a"/>
  </g>

  <!-- Нижняя полоса с услугами -->
  <rect x="0" y="830" width="1600" height="170" fill="#1d1914"/>
  <g fill="#2c261e">
    <rect x="96" y="866" width="320" height="98" rx="16"/>
    <rect x="448" y="866" width="320" height="98" rx="16"/>
    <rect x="800" y="866" width="320" height="98" rx="16"/>
    <rect x="1152" y="866" width="352" height="98" rx="16"/>
  </g>
  <g fill="#8a8072">
    <rect x="128" y="896" width="150" height="12" rx="6"/>
    <rect x="480" y="896" width="170" height="12" rx="6"/>
    <rect x="832" y="896" width="130" height="12" rx="6"/>
    <rect x="1184" y="896" width="160" height="12" rx="6"/>
  </g>
  <g fill="#c9a96a">
    <rect x="128" y="926" width="80" height="12" rx="6"/>
    <rect x="480" y="926" width="80" height="12" rx="6"/>
    <rect x="832" y="926" width="80" height="12" rx="6"/>
    <rect x="1184" y="926" width="80" height="12" rx="6"/>
  </g>
</svg>
